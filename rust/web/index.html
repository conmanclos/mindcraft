<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mindcraft Native</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191c22;--line:#2c313a;--text:#eef0f4;--muted:#a0a8b5;--accent:#8bc5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:40px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:25px;margin:0}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{padding:12px;background:#12151a;border:1px solid var(--line);border-radius:9px}
.stat b{display:block;font-size:18px;margin-top:4px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
input,textarea,button{font:inherit;color:var(--text);background:#11141a;border:1px solid var(--line);border-radius:8px;padding:10px}
input{width:100%}textarea{width:100%;min-height:90px;resize:vertical}button{cursor:pointer;background:#24415c;border-color:#365d80}button.secondary{background:#252a32;border-color:var(--line)}button:hover{filter:brightness(1.15)}
#log{white-space:pre-wrap;min-height:100px;max-height:340px;overflow:auto;background:#101318;padding:12px;border-radius:8px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row button{white-space:nowrap}
#proposal{white-space:pre-wrap;background:#101318;padding:12px;border-radius:8px;margin-top:12px;display:none}
</style>
</head>
<body><main>
<div class="top"><div><h1>Mindcraft Native</h1><div class="muted">Rust runtime · Minecraft Java 1.21.1</div></div><div class="muted" id="connection">API not checked</div></div>
<section class="panel"><label for="token">Dashboard API token (kept in this tab only)</label><div class="row"><input id="token" type="password" autocomplete="off" placeholder="Paste the token printed by the runtime"><button id="connect">Connect</button></div></section>
<section class="panel"><div class="grid">
<div class="stat"><span class="muted">Minecraft</span><b id="mc">Unknown</b></div>
<div class="stat"><span class="muted">Autonomy</span><b id="mode">Unknown</b></div>
<div class="stat"><span class="muted">AI provider</span><b id="provider">Unknown</b></div>
<div class="stat"><span class="muted">Model</span><b id="model">Unknown</b></div>
</div></section>
<section class="panel"><h2>Teammate chat</h2><div id="log" aria-live="polite">Connect to the local runtime to begin.</div>
<label for="message">Message</label><textarea id="message" placeholder="Ask Mindcraft a question or mention Mindcraft in Minecraft chat..."></textarea>
<div class="row"><button id="send">Send message</button><button id="plan" class="secondary">Propose game action</button><span class="muted" id="hint">Plans are policy-checked but not executed by this build.</span></div>
<div id="proposal"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let token="";
function log(s){$("log").textContent += "\n"+s;$("log").scrollTop=$("log").scrollHeight}
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Authorization":"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||data.message||("HTTP "+r.status));return data}
async function connect(){token=$("token").value.trim();if(!token)throw Error("Enter the API token printed in the terminal.");const s=await api("/api/status");$("mc").textContent=s.minecraft_connected?"Connected":"Not connected";$("mode").textContent=s.autonomy;$("provider").textContent=s.provider;$("model").textContent=s.model;$("connection").textContent="Connected to local runtime"}
$("connect").onclick=()=>connect().catch(e=>{$("connection").textContent=e.message});
$("send").onclick=async()=>{try{if(!token)await connect();const message=$("message").value.trim();if(!message)return;log("You: "+message);$("message").value="";$("send").disabled=true;const r=await api("/api/chat",{message});log("Mindcraft: "+r.reply)}catch(e){log("Error: "+e.message)}finally{$("send").disabled=false}};
$("plan").onclick=async()=>{try{if(!token)await connect();const message=$("message").value.trim();if(!message)throw Error("Describe the action you want planned in the message box.");$("plan").disabled=true;const r=await api("/api/plan",{message});$("proposal").style.display="block";$("proposal").textContent=JSON.stringify(r.proposed_action,null,2)+"\nExecution: "+r.execution}catch(e){$("proposal").style.display="block";$("proposal").textContent="Plan rejected: "+e.message}finally{$("plan").disabled=false}};
</script></body></html>
